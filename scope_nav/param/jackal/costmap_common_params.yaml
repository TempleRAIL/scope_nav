map_type: costmap
origin_z: 0.0
z_resolution: 1
z_voxels: 2

obstacle_range: 2.5
raytrace_range: 3.0

publish_voxel_map: false
transform_tolerance: 0.5
meter_scoring: true

footprint: [[-0.21, -0.165], [-0.21, 0.165], [0.21, 0.165], [0.21, -0.165]]
footprint_padding: 0.1

plugins:
- {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"}
- {name: inflater_layer, type: "costmap_2d::InflationLayer"}

obstacles_layer:
  observation_sources: scan
  scan: {sensor_frame: front_laser, data_type: LaserScan, topic: front/scan, marking: true, clearing: true, min_obstacle_height: -2.0, max_obstacle_height: 2.0, obstacle_range: 2.5, raytrace_range: 3.0}

inflater_layer:
 inflation_radius: 0.30

# add scope costmap layers:
scope_prediction_layer:
   people_topic: scope_prediction
   enabled:               true
   cutoff:                115    #  double, default: 10.0 - Smallest value to publish on costmap adjustments
   amplitude:             200   #  double, default: 77.0 - Amplitude of adjustments at peak
   covariance:            0.25    #  double, default: 0.25 - Covariance of adjustments
   factor:                5.0     #  double, default: 5.0 -  Factor with which to scale the velocity
   keep_time:             0.5    #  double, default: 0.75

scope_uncertainty_layer:
  people_topic: scope_uncertainty #sogmp_prediction
  enabled:               true
  cutoff:                115    #  double, default: 10.0 - Smallest value to publish on costmap adjustments
  amplitude:             200   #  double, default: 77.0 - Amplitude of adjustments at peak
  covariance:            0.25    #  double, default: 0.25 - Covariance of adjustments
  factor:                5.0     #  double, default: 5.0 -  Factor with which to scale the velocity
  keep_time:             0.5    #  double, default: 0.75
